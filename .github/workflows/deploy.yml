name: Build and Deploy

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "scripts/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch: # Actions sekmesinden elle çalıştırmak için

# Repoya sadece okuma yetkisi
permissions:
  contents: read

# Aynı anda iki deploy çalışmasın; yenisi gelirse eskisi beklesin
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  AWS_REGION: eu-north-1
  ECR_REPOSITORY: case1-app

jobs:
  deploy:
    # ubuntu-latest Ubuntu 26'ya geçiyor; sürpriz olmasın diye sabit sürüm
    runs-on: ubuntu-24.04
    # Sadece main branch'inden deploy (elle tetiklemede de)
    if: github.ref == 'refs/heads/main'
    # AWS secret'ları "production" environment'ında; environment'ın deployment
    # branch kuralı sadece main'e izin veriyor (ve istenirse onaycı istiyor).
    environment: production

    steps:
      - name: Kodu çek
        uses: actions/checkout@v7

      - name: AWS'ye giriş yap (GitHub Secrets'taki access key ile)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: ECR'a login ol
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: İmajı build et ve ECR'a push et
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          TAG: ${{ github.sha }}
        run: |
          SHORT="${TAG:0:7}"
          # ECR tag'leri IMMUTABLE: aynı commit tekrar çalıştırılırsa (re-run) tag zaten
          # vardır ve push reddedilir. Bu durumda build/push atlanır, mevcut imaj kullanılır.
          if DIGEST=$(aws ecr describe-images --repository-name "$ECR_REPOSITORY" \
               --image-ids imageTag="$SHORT" --query 'imageDetails[0].imageDigest' --output text 2>/dev/null); then
            echo "İmaj zaten var ($SHORT), build/push atlanıyor."
          else
            sed -i "s/__VERSION__/$SHORT/" app/index.html
            docker build -t "$REGISTRY/$ECR_REPOSITORY:$SHORT" app
            docker push "$REGISTRY/$ECR_REPOSITORY:$SHORT"
            # Deploy tag ile değil digest ile: sunucuya tam olarak bu build'in imajı gider.
            REPO_DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$REGISTRY/$ECR_REPOSITORY:$SHORT")
            DIGEST="${REPO_DIGEST##*@}"
          fi
          if [[ ! "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "HATA: Digest alınamadı: '$DIGEST'"
            exit 1
          fi
          echo "İmaj: $REGISTRY/$ECR_REPOSITORY@$DIGEST (tag: $SHORT)"
          echo "IMAGE_DIGEST=$DIGEST" >> "$GITHUB_ENV"

      - name: Private sunucuya SSM ile deploy et (+ sağlık kontrolü)
        env:
          AWS_DEFAULT_REGION: ${{ env.AWS_REGION }}
          DEPLOY_DOCUMENT: case1-deploy-app
        run: bash scripts/deploy.sh "$IMAGE_DIGEST"
